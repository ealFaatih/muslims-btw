<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Muslims BTW</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>

    <!-- Form Login -->
    <section id="loginSection" class="admin-login">
      <form id="loginForm" class="admin-login__form">
        <h1>Login Admin</h1>
        <p id="loginError" class="admin-login__error"></p>

        <div class="form__group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form__group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn btn--primary">Masuk</button>
      </form>
    </section>

    <!-- Dashboard (Tersembunyi sampai login berhasil) -->
    <section id="dashboardSection" class="admin-dashboard" hidden>
      <header class="admin-dashboard__header">
        <h1>Dashboard Admin — Muslims BTW</h1>
        <button id="logoutBtn" class="btn btn--outline">Keluar</button>
      </header>

      <div id="dashboardContent">
        <p>Selamat datang! Dashboard ini masih dalam pengembangan.</p>
      </div>
    </section>

    <script src="assets/js/admin.js"></script>
  </body>
</html>
