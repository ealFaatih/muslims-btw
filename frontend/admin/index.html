<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Muslims BTW</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>
    <!-- Form Login -->
    <section id="loginSection" class="admin-login">
      <form id="loginForm" class="admin-login__form">
        <h1>Login Admin</h1>
        <p id="loginError" class="admin-login__error"></p>

        <div class="form__group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form__group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn btn--primary">Masuk</button>
      </form>
    </section>

    <!-- Dashboard (Tersembunyi sampai login berhasil) -->
    <section id="dashboardSection" class="admin-dashboard" hidden>
      <header class="admin-dashboard__header">
        <h1>Dashboard Admin — Muslims BTW</h1>
        <button id="logoutBtn" class="btn btn--outline">Keluar</button>
      </header>

      <div id="dashboardContent">
        <section class="admin-section">
          <div class="admin-section__header">
            <h2>Kelola Kegiatan</h2>
            <button id="btnTambahKegiatan" class="btn btn--primary">
              + Tambah Kegiatan
            </button>
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>Judul</th>
                <th>Tanggal</th>
                <th>Lokasi</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelKegiatan">
              <!-- Diisi otomatis lewat JavaScript -->
            </tbody>
          </table>
        </section>

        <section class="admin-section" style="margin-top: 2rem">
          <div class="admin-section__header">
            <h2>Laporan Masuk (Kritik, Saran, Aduan)</h2>
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Kontak</th>
                <th>Isi Laporan</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tabelPengaduan">
              <!-- Diisi otomatis lewat JavaScript -->
            </tbody>
          </table>
        </section>

        <section class="admin-section" style="margin-top: 2rem">
          <div class="admin-section__header">
            <h2>Dokumentasi Kegiatan</h2>
            <button id="btnTambahDokumentasi" class="btn btn--primary">
              + Tambah Dokumentasi
            </button>
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>Kegiatan</th>
                <th>Tanggal</th>
                <th>Jumlah Foto</th>
              </tr>
            </thead>
            <tbody id="tabelDokumentasi">
              <!-- Diisi otomatis lewat JavaScript -->
            </tbody>
          </table>
        </section>

        <!-- Modal form tambah dokumentasi -->
        <div id="modalDokumentasi" class="admin-modal" hidden>
          <div class="admin-modal__box">
            <h3>Tambah Dokumentasi Kegiatan</h3>
            <form id="formDokumentasi">
              <div class="form__group">
                <label for="dKegiatan">Pilih Kegiatan</label>
                <select id="dKegiatan" required></select>
              </div>
              <div class="form__group">
                <label for="dDeskripsi">Deskripsi</label>
                <textarea id="dDeskripsi" rows="3" required></textarea>
              </div>
              <div class="form__group">
                <label for="dTanggal">Tanggal</label>
                <input type="date" id="dTanggal" required />
              </div>
              <div class="form__group">
                <label for="dFoto">Foto (bisa pilih lebih dari satu</label>
                <input
                  type="file"
                  id="dFoto"
                  accept="image/*"
                  multiple
                  required
                />
              </div>
              <p id="uploadStatus" class="admin-login__error"></p>
              <div class="admin-modal__actions">
                <button
                  type="button"
                  id="btnBatalDokumentasi"
                  class="btn btn--outline-primary"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  id="btnSimpanDokumentasi"
                  class="btn btn--primary"
                >
                  Simpan
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Modal form tambah kegiatan -->
        <div id="modalKegiatan" class="admin-modal" hidden>
          <div class="admin-modal__box">
            <h3>Tambah Kegiatan Baru</h3>
            <form id="formKegiatan">
              <div class="form__group">
                <label for="fJudul">Judul</label>
                <input type="text" id="fJudul" required />
              </div>
              <div class="form__group">
                <label for="fDeskripsi">Deskripsi</label>
                <textarea id="fDeskripsi" rows="3" required></textarea>
              </div>
              <div class="form__group">
                <label for="fTanggal">Tanggal</label>
                <input type="date" id="fTanggal" required />
              </div>
              <div class="form__group">
                <label for="fLokasi">Lokasi</label>
                <input type="text" id="fLokasi" required />
              </div>
              <div class="form__group">
                <label for="fKuota">Kuota</label>
                <input type="number" id="fKuota" />
              </div>
              <div class="admin-modal__actions">
                <button
                  type="button"
                  id="btnBatalKegiatan"
                  class="btn btn--outline-primary"
                >
                  Batal
                </button>
                <button type="submit" class="btn btn--primary">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="assets/js/admin.js"></script>
  </body>
</html>
